# Quality gate on every push and pull request: the unit tests, a fast simulation check and a short economy check.
# Every step fails the workflow through its exit code (never through reading printed text).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot (official release)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Link Creator Studio to the shared src and data (the Windows junctions do not exist in a fresh checkout)
        run: |
          rm -rf creator_studio/game_src creator_studio/data creator_studio/assets
          ln -s "$PWD/src" creator_studio/game_src
          ln -s "$PWD/data" creator_studio/data
          ln -s "$PWD/assets" creator_studio/assets

      - name: Import the project (registers every class)
        run: ~/godot/godot --headless --path . --import --quit

      - name: Validate the project (GDScript compile errors, broken scenes and resources, unimported assets, invalid JSON, invalid player models and animation clips; exit code 1 on any problem)
        run: ~/godot/godot --headless --path . --script res://tools/validate_project.gd

      - name: Unit tests (exit code 1 on any failure)
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      - name: Live UI tests (tweens, timers, focus and input in a real scene tree; exit code 1 on any failure)
        run: ~/godot/godot --headless --path . --script res://tests/run_live_tests.gd

      - name: Simulation check, 1000 games (exit code 1 if any league average is out of range)
        run: ~/godot/godot --headless --path . --script res://tools/simulate_games.gd -- games=1000 strict=1

      - name: Economy check, 12 teams, 15 seasons (exit code 1 if profit, cash, debt or payroll runs away)
        run: ~/godot/godot --headless --path . --script res://tools/economy_check.gd -- seasons=15 teams=12 every=5

      - name: Creator Studio smoke (the separate project that shares the game code and data; exit code 1 on failure)
        run: |
          ~/godot/godot --headless --path creator_studio --import --quit
          ~/godot/godot --headless --path creator_studio --script res://tools/studio_smoke.gd
